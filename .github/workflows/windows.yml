
name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $project = Get-ChildItem -Path . -Filter app.py -Recurse -File | Select-Object -First 1
          if (-not $project) { throw "app.py introuvable" }
          $folder = $project.DirectoryName
          python -m pip install -r "$folder/requirements.txt"
          python -m pip install pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter app.py -Recurse -File | Select-Object -First 1
          if (-not $project) { throw "app.py introuvable" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpusLatencyAnalyzer "$($project.FullName)"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: OpusLatencyAnalyzer-Windows
          path: dist/OpusLatencyAnalyzer.exe
          if-no-files-found: error
